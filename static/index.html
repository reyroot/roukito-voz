<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ver en la tele</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; color: #fff; font-family: sans-serif; }
    button {
      width: 100%;
      height: 100%;
      border: 0;
      background: #0b5;
      color: #fff;
      font-size: 3rem;
      font-weight: 700;
    }
    button.busy { background: #c60; }
    p { position: fixed; left: 1rem; right: 1rem; bottom: 1rem; margin: 0; font-size: 1.1rem; }
  </style>
</head>
<body>
  <button id="talk" type="button" aria-label="Hablar con la tele">Hablar</button>
  <p id="status" aria-live="polite"></p>
  <script>
    const button = document.querySelector("#talk");
    const status = document.querySelector("#status");
    const session = crypto.randomUUID();
    const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;

    function setStatus(text) {
      status.textContent = text;
    }

    function spanishVoice() {
      const voices = speechSynthesis.getVoices();
      return voices.find((voice) => voice.lang.toLowerCase().startsWith("es"));
    }

    function speak(text) {
      return new Promise((resolve) => {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "es-MX";
        utterance.rate = 0.95;
        const voice = spanishVoice();
        if (voice) utterance.voice = voice;
        let finished = false;
        const finish = () => {
          if (finished) return;
          finished = true;
          clearInterval(kick);
          clearTimeout(limit);
          resolve();
        };
        utterance.onend = finish;
        utterance.onerror = finish;
        speechSynthesis.cancel();
        speechSynthesis.speak(utterance);
        const kick = setInterval(() => {
          if (!speechSynthesis.speaking) return;
          speechSynthesis.pause();
          speechSynthesis.resume();
        }, 3500);
        const limit = setTimeout(finish, Math.min(14000, 1200 + text.length * 65));
      });
    }

    function listen() {
      return new Promise((resolve, reject) => {
        if (!Speech) {
          reject(new Error("Este navegador no puede escuchar."));
          return;
        }
        const recognition = new Speech();
        recognition.lang = "es-MX";
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;
        let settled = false;
        const finish = (error, text) => {
          if (settled) return;
          settled = true;
          clearTimeout(limit);
          if (error) reject(error);
          else resolve(text || "");
        };
        recognition.onresult = (event) => {
          finish(null, event.results[0][0].transcript || "");
        };
        recognition.onerror = (event) => finish(new Error(event.error || "error"));
        recognition.onend = () => setTimeout(() => finish(new Error("silence")), 200);
        const limit = setTimeout(() => {
          try { recognition.stop(); } catch (error) {}
          finish(new Error("timeout"));
        }, 12000);
        recognition.start();
      });
    }

    async function send(text) {
      const response = await fetch("/api/turn", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session, text }),
      });
      const data = await response.json();
      if (!response.ok && !data.say) throw new Error(data.error || "error");
      return data;
    }

    async function conversation() {
      button.disabled = true;
      button.classList.add("busy");
      button.textContent = "Escuchando";
      try {
        await speak("¿Qué quieres ver?");
        setStatus("¿Qué quieres ver?");
        const topic = await listen();
        setStatus(topic);
        let data = await send(topic);
        await speak(data.say);
        setStatus(data.say);
        while (data.phase === "choice") {
          const answer = await listen();
          setStatus(answer);
          data = await send(answer);
          await speak(data.say);
          setStatus(data.say);
        }
      } catch (error) {
        const message = "No te escuché. Pulsa el botón e inténtalo otra vez.";
        setStatus(message);
        await speak(message);
      } finally {
        button.disabled = false;
        button.classList.remove("busy");
        button.textContent = "Hablar";
      }
    }

    speechSynthesis.onvoiceschanged = () => spanishVoice();
    button.addEventListener("click", () => {
      conversation();
    });
  </script>
</body>
</html>
